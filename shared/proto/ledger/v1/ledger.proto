syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Vlad777-bit/personal-finance-analytics/shared/gen/go/ledger/v1;ledgerv1";

service LedgerService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
  rpc CreateBudget(CreateBudgetRequest) returns (CreateBudgetResponse);
}

message Transaction {
  string id = 1;
  string user_id = 2;
  int64 amount = 3;
  string category = 4;
  string description = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateTransactionRequest {
  string user_id = 1;
  int64 amount = 2;
  string category = 3;
  string description = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message GetTransactionsRequest {
  string user_id = 1;
  string category = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message GetTransactionsResponse {
  repeated Transaction transactions = 1;
}

message Budget {
  string id = 1;
  string user_id = 2;
  string category = 3;
  int64 limit_amount = 4;
}

message CreateBudgetRequest {
  string user_id = 1;
  string category = 2;
  int64 limit_amount = 3;
}

message CreateBudgetResponse {
  Budget budget = 1;
}
