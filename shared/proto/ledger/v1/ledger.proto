syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Vlad777-bit/personal-finance-analytics/shared/gen/go/ledger/v1;ledgerv1";

service LedgerService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
  rpc CreateBudget(CreateBudgetRequest) returns (CreateBudgetResponse);
  rpc GetBudgets(GetBudgetsRequest) returns (GetBudgetsResponse);
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
}

message Transaction {
  string id = 1;
  string user_id = 2;
  int64 amount = 3;
  string category = 4;
  string description = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateTransactionRequest {
  string user_id = 1;
  int64 amount = 2;
  string category = 3;
  string description = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message GetTransactionsRequest {
  string user_id = 1;
  string category = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message GetTransactionsResponse {
  repeated Transaction transactions = 1;
}

message Budget {
  string id = 1;
  string user_id = 2;
  string category = 3;
  int64 limit_amount = 4;
}

message CreateBudgetRequest {
  string user_id = 1;
  string category = 2;
  int64 limit_amount = 3;
}

message CreateBudgetResponse {
  Budget budget = 1;
}

message GetBudgetsRequest {
  string user_id = 1;
}

message GetBudgetsResponse {
  repeated Budget budgets = 1;
}

message CategorySummary {
  string category = 1;
  int64 spent = 2;
  int64 budget_limit = 3;
  bool budget_configured = 4;
  int64 remaining = 5;
  bool budget_exceeded = 6;
}

message Summary {
  string user_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int64 total_spent = 4;
  repeated CategorySummary categories = 5;
}

message GetSummaryRequest {
  string user_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message GetSummaryResponse {
  Summary summary = 1;
}
