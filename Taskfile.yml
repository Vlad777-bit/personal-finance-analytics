version: '3'

vars:
  GO_VERSION: '1.26'
  MODULES: 'gateway ledger auth shared integration'

  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GCI_VERSION: 'v0.13.6'
  GOFUMPT_VERSION: 'v0.8.0'
  BUF_VERSION: '1.53.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.6'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.5.1'
  GRPCURL_VERSION: 'v1.9.3'
  MOCKERY_VERSION: 'v2.53.3'
  GOOSE_VERSION: 'v3.28.0'

  BIN_DIR: '{{.ROOT_DIR}}/bin'

  GOLANGCI_LINT: '{{.ROOT_DIR}}/bin/golangci-lint'
  GCI: '{{.ROOT_DIR}}/bin/gci'
  GOFUMPT: '{{.ROOT_DIR}}/bin/gofumpt'
  BUF: '{{.ROOT_DIR}}/bin/buf'
  PROTOC_GEN_GO: '{{.ROOT_DIR}}/bin/protoc-gen-go'
  PROTOC_GEN_GO_GRPC: '{{.ROOT_DIR}}/bin/protoc-gen-go-grpc'
  GRPCURL: '{{.ROOT_DIR}}/bin/grpcurl'
  MOCKERY: '{{.ROOT_DIR}}/bin/mockery'
  GOOSE: '{{.ROOT_DIR}}/bin/goose'

  LEDGER_MIGRATIONS_DIR: '{{.ROOT_DIR}}/migrations/ledger'
  AUTH_MIGRATIONS_DIR: '{{.ROOT_DIR}}/migrations/auth'

silent: true

tasks:
  tools:
    desc: Install all development tools into ./bin
    deps:
      - format:install
      - lint:install
      - buf:install
      - proto:install
      - mockery:install
      - goose:install
      - grpcurl:install

  format:install:
    desc: Install gofumpt and gci into ./bin
    cmds:
      - |
        set -e
        mkdir -p {{.BIN_DIR}}
        [ -x {{.GOFUMPT}} ] || GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        [ -x {{.GCI}} ] || GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: Format Go code in every workspace module
    deps: [format:install]
    cmds:
      - |
        set -e
        for module in {{.MODULES}}; do
          [ -d "$module" ] || continue
          echo "gofumpt: $module"
          find "$module" -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/gen/*' -exec {{.GOFUMPT}} -extra -w {} +
          echo "gci: $module"
          find "$module" -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/gen/*' -exec {{.GCI}} write -s standard -s default -s 'prefix(github.com/Vlad777-bit/personal-finance-analytics)' {} +
        done


  lint:install:
    desc: Install golangci-lint into ./bin
    cmds:
      - |
        set -e
        mkdir -p {{.BIN_DIR}}
        EXPECTED='{{.GOLANGCI_LINT_VERSION}}'
        CURRENT=''
        if [ -x {{.GOLANGCI_LINT}} ]; then
          CURRENT="$({{.GOLANGCI_LINT}} version 2>/dev/null | sed -n 's/.*version \([^ ]*\).*/v\1/p' | head -n1)"
        fi
        if [ "$CURRENT" != "$EXPECTED" ]; then
          echo "Installing golangci-lint $EXPECTED"
          rm -f {{.GOLANGCI_LINT}}
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${EXPECTED}
        fi


  lint:
    desc: Run golangci-lint in every workspace module
    deps: [lint:install]
    cmds:
      - |
        set -e
        ERR=0
        for module in {{.MODULES}}; do
          [ -f "$module/go.mod" ] || continue
          if ! (cd "$module" && go list ./... 2>/dev/null | grep -q .); then
            echo "lint: $module (skip: no Go packages)"
            continue
          fi
          echo "lint: $module"
          (
            cd "$module"
            {{.GOLANGCI_LINT}} run ./... --config=../.golangci.yml
          ) || ERR=1
        done
        exit "$ERR"


  deps:update:
    desc: Sync workspace and tidy every Go module
    cmds:
      - |
        set -e
        go work sync
        for module in {{.MODULES}}; do
          [ -f "$module/go.mod" ] || continue
          echo "go mod tidy: $module"
          (cd "$module" && go mod tidy)
        done


  buf:install:
    desc: Install buf into ./bin
    cmds:
      - |
        set -e
        mkdir -p {{.BIN_DIR}}
        [ -x {{.BUF}} ] || GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
    status:
      - test -x {{.BUF}}

  proto:install:
    desc: Install protobuf Go plugins into ./bin
    cmds:
      - |
        set -e
        mkdir -p {{.BIN_DIR}}
        [ -x {{.PROTOC_GEN_GO}} ] || GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
        [ -x {{.PROTOC_GEN_GO_GRPC}} ] || GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
    status:
      - test -x {{.PROTOC_GEN_GO}}
      - test -x {{.PROTOC_GEN_GO_GRPC}}

  proto:lint:
    desc: Lint protobuf definitions
    deps: [buf:install]
    dir: shared/proto
    cmds:
      - '{{.BUF}} lint'

  proto:gen:
    desc: Generate Go code from protobuf definitions
    deps: [buf:install, proto:install, proto:lint]
    dir: shared/proto
    cmds:
      - '{{.BUF}} generate'

  grpcurl:install:
    desc: Install grpcurl into ./bin
    cmds:
      - |
        set -e
        mkdir -p {{.BIN_DIR}}
        [ -x {{.GRPCURL}} ] || GOBIN={{.BIN_DIR}} go install github.com/fullstorydev/grpcurl/cmd/grpcurl@{{.GRPCURL_VERSION}}
    status:
      - test -x {{.GRPCURL}}

  mockery:install:
    desc: Install mockery into ./bin
    cmds:
      - |
        set -e
        mkdir -p {{.BIN_DIR}}
        [ -x {{.MOCKERY}} ] || GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
    status:
      - test -x {{.MOCKERY}}

  mockery:gen:
    desc: Generate mocks from configured interfaces
    deps: [mockery:install]
    cmds:
      - '{{.MOCKERY}}'

  test:
    desc: Run tests in every workspace module
    cmds:
      - |
        set -e
        for module in {{.MODULES}}; do
          [ -f "$module/go.mod" ] || continue
          if ! (cd "$module" && go list ./... 2>/dev/null | grep -q .); then
            echo "test: $module (skip: no Go packages)"
            continue
          fi
          echo "test: $module"
          (cd "$module" && go test ./...)
        done


  test:race:
    desc: Run tests with the race detector in every workspace module
    cmds:
      - |
        set -e
        for module in {{.MODULES}}; do
          [ -f "$module/go.mod" ] || continue
          if ! (cd "$module" && go list ./... 2>/dev/null | grep -q .); then
            echo "race: $module (skip: no Go packages)"
            continue
          fi
          echo "race: $module"
          (cd "$module" && go test -race ./...)
        done


  test:coverage:
    desc: Build a combined coverage profile for modules that contain packages
    cmds:
      - |
        set -e
        rm -rf coverage
        mkdir -p coverage
        echo 'mode: atomic' > coverage/cover.out
        for module in {{.MODULES}}; do
          [ -f "$module/go.mod" ] || continue
          if ! (cd "$module" && go list ./... | grep -q .); then
            continue
          fi
          TMP="{{.ROOT_DIR}}/coverage/${module}.out"
          (cd "$module" && go test -covermode=atomic -coverprofile="$TMP" ./...)
          tail -n +2 "$TMP" >> coverage/cover.out
        done
        go tool cover -func=coverage/cover.out


  test:integration:
    desc: "Запускает integration-тесты Ledger с PostgreSQL и Redis"
    cmds:
      - |
        set -e
  
        set -a
        [ ! -f .env ] || . ./.env
        set +a
  
        if [ -z "$LEDGER_DATABASE_URL" ]; then
          echo "❌ LEDGER_DATABASE_URL is not set"
          exit 1
        fi
  
        AUTH_DATABASE_URL="${AUTH_DATABASE_URL:-$LEDGER_DATABASE_URL}"
        export AUTH_DATABASE_URL

        echo "🧪 Running Ledger integration tests..."
  
        (
          cd ledger
          go test \
            -tags=integration \
            -count=1 \
            -v \
            ./internal/cache/redis \
            ./internal/app \
            ./internal/repository/database/...
        )

        echo "🧪 Running Auth integration tests..."

        (
          cd auth
          go test \
            -tags=integration \
            -count=1 \
            -v \
            ./internal/repository/database/...
        )

        echo "🧪 Running HTTP end-to-end integration tests..."

        (
          cd integration
          go test \
            -tags=integration \
            -count=1 \
            -v \
            ./...
        )



  gateway:
    desc: Run Gateway locally
    dir: gateway
    cmds:
      - go run ./cmd/gateway

  up:
    desc: Start project infrastructure with Compose
    cmds:
      - podman compose -f compose.yaml up -d --build

  down:
    desc: Stop project infrastructure
    cmds:
      - podman compose -f compose.yaml down

  goose:install:
    desc: "Устанавливает goose в ./bin"
    cmds:
      - |
        set -e

        mkdir -p "{{.BIN_DIR}}"

        CURRENT_VERSION=""

        if [ -x "{{.GOOSE}}" ]; then
          CURRENT_VERSION="$("{{.GOOSE}}" -version 2>/dev/null | awk '{print $3}' || true)"
        fi

        if [ "$CURRENT_VERSION" != "{{.GOOSE_VERSION}}" ]; then
          echo "📦 Устанавливаем goose {{.GOOSE_VERSION}}..."

          rm -f "{{.GOOSE}}"

          GOBIN="{{.BIN_DIR}}" \
            go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
        fi

        if [ ! -x "{{.GOOSE}}" ]; then
          echo "❌ goose installation failed"
          exit 1
        fi

        echo "✅ goose: $("{{.GOOSE}}" -version)"




  migration:create:
    desc: "Создаёт новую SQL-миграцию для Ledger"
    deps:
      - goose:install
    requires:
      vars:
        - NAME
    cmds:
      - |
        set -e

        mkdir -p "{{.LEDGER_MIGRATIONS_DIR}}"

        echo "📝 Creating migration: {{.NAME}}"

        "{{.GOOSE}}" \
          -dir "{{.LEDGER_MIGRATIONS_DIR}}" \
          -s \
          create "{{.NAME}}" sql

        echo "✅ Migration created"







  migration:status:
    desc: "Показывает состояние миграций Ledger"
    deps:
      - goose:install
    cmds:
      - |
        set -a
        [ ! -f .env ] || . ./.env
        set +a

        if [ -z "$LEDGER_DATABASE_URL" ]; then
          echo "❌ LEDGER_DATABASE_URL is not set"
          exit 1
        fi

        echo "🔎 Checking migrations status..."

        {{.GOOSE}} \
          -dir {{.LEDGER_MIGRATIONS_DIR}} \
          postgres \
          "$LEDGER_DATABASE_URL" \
          status -v




  migration:up:
    desc: "Применяет все pending-миграции Ledger"
    deps:
      - goose:install
    cmds:
      - |
        set -a
        [ ! -f .env ] || . ./.env
        set +a

        if [ -z "$LEDGER_DATABASE_URL" ]; then
          echo "❌ LEDGER_DATABASE_URL is not set"
          exit 1
        fi

        echo "🚀 Running migrations..."

        {{.GOOSE}} \
          -dir {{.LEDGER_MIGRATIONS_DIR}} \
          postgres \
          "$LEDGER_DATABASE_URL" \
          up -v

        echo "✅ Migrations applied"




  migration:down:
    desc: "Откатывает последнюю миграцию Ledger"
    deps:
      - goose:install
    cmds:
      - |
        set -a
        [ ! -f .env ] || . ./.env
        set +a

        if [ -z "$LEDGER_DATABASE_URL" ]; then
          echo "❌ LEDGER_DATABASE_URL is not set"
          exit 1
        fi

        echo "↩️ Reverting migration..."

        {{.GOOSE}} \
          -dir {{.LEDGER_MIGRATIONS_DIR}} \
          postgres \
          "$LEDGER_DATABASE_URL" \
          down -v

        echo "✅ Migration reverted"

  migration:auth:create:
    desc: "Создаёт новую SQL-миграцию для Auth"
    deps: [goose:install]
    requires:
      vars: [NAME]
    cmds:
      - |
        set -e
        mkdir -p "{{.AUTH_MIGRATIONS_DIR}}"
        "{{.GOOSE}}" -dir "{{.AUTH_MIGRATIONS_DIR}}" -s create "{{.NAME}}" sql

  migration:auth:status:
    desc: "Показывает состояние миграций Auth"
    deps: [goose:install]
    cmds:
      - |
        set -a
        [ ! -f .env ] || . ./.env
        set +a
        AUTH_DATABASE_URL="${AUTH_DATABASE_URL:-$LEDGER_DATABASE_URL}"
        if [ -z "$AUTH_DATABASE_URL" ]; then
          echo "❌ AUTH_DATABASE_URL is not set"
          exit 1
        fi
        {{.GOOSE}} -table goose_auth_db_version -dir {{.AUTH_MIGRATIONS_DIR}} postgres "$AUTH_DATABASE_URL" status -v

  migration:auth:up:
    desc: "Применяет все pending-миграции Auth"
    deps: [goose:install]
    cmds:
      - |
        set -a
        [ ! -f .env ] || . ./.env
        set +a
        AUTH_DATABASE_URL="${AUTH_DATABASE_URL:-$LEDGER_DATABASE_URL}"
        if [ -z "$AUTH_DATABASE_URL" ]; then
          echo "❌ AUTH_DATABASE_URL is not set"
          exit 1
        fi
        {{.GOOSE}} -table goose_auth_db_version -dir {{.AUTH_MIGRATIONS_DIR}} postgres "$AUTH_DATABASE_URL" up -v

  migration:auth:down:
    desc: "Откатывает последнюю миграцию Auth"
    deps: [goose:install]
    cmds:
      - |
        set -a
        [ ! -f .env ] || . ./.env
        set +a
        AUTH_DATABASE_URL="${AUTH_DATABASE_URL:-$LEDGER_DATABASE_URL}"
        if [ -z "$AUTH_DATABASE_URL" ]; then
          echo "❌ AUTH_DATABASE_URL is not set"
          exit 1
        fi
        {{.GOOSE}} -table goose_auth_db_version -dir {{.AUTH_MIGRATIONS_DIR}} postgres "$AUTH_DATABASE_URL" down -v
